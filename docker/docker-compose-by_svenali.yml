services:
  web:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        commitHash: "local-dev"
        MEMPOOL_NETWORK: regtest
    #network_mode: "host"
    environment:
      MEMPOOL_NETWORK: regtest
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: "172.18.0.1"
    #image: mempool/frontend:latest
    #user: "0:0"
    restart: on-failure
    stop_grace_period: 1m
    #command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
    ports:
      - "8080:80"
  api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      args:
        commitHash: "local-dev"
    network_mode: "host"
    environment:
      MEMPOOL_BACKEND: "electrum"
      CORE_RPC_HOST: "127.0.0.1"
      CORE_RPC_PORT: "18334"
      CORE_RPC_USERNAME: ""
      CORE_RPC_PASSWORD: ""
      CORE_RPC_TIMEOUT: 60000
      CORE_RPC_COOKIE: true
      CORE_RPC_COOKIE_PATH: "/root/.bitcoin/.cookie"
      ELECTRUM_HOST: "127.0.0.1"
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "127.0.0.1"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
    #image: node:22-bookworm 
    user: "0:0"
    restart: on-failure
    stop_grace_period: 1m
    working_dir: /backend
    command: "./wait-for-it.sh 127.0.0.1:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
    #  - ../backend:/backend/package
    #  - ./data:/backend/cache
      - /home/bitcoin/.bitcoin/regtest/.cookie:/root/.bitcoin/.cookie:ro
    ports:
      - "8999:8999"
  db: 
    network_mode: "host"
    environment:
      DATABASE_HOST: "127.0.0.1"
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "admin"
      MARIADB_AUTO_UPGRADE: "1"
    image: mariadb:10.5.21
    ports: 
      - "3306:3306"
    #user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool", "-pmempool"] 
      interval: 5s 
      timeout: 5s 
      retries: 10
