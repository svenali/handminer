  <div class="panel">
    <h3>Mempool Barrel (offene TX)</h3>
    <mempool-barrel [txs]="mempoolTxs" [fillLevel]="fillLevel"></mempool-barrel>
  </div>

  <!-- Dein Block --->
  <div class="panel block"
  cdkDropList
  [cdkDropListData]="blockTxs"
  #blockDropList="cdkDropList"
  id="blockDropList"
  (cdkDropListDropped)="onDropToBlock($event)">

    <h3>Dein Block</h3>

    <div class="block-stats">
      TXs: {{ blockTxs.length }} |
      Size: {{ totalVSize | number:'1.0-0' }} vB |
      Fees: {{ totalFees }} sat
    </div>

    <div class="tx-list">
      <div class="tx-row" *ngFor="let tx of blockTxs">
        <div class="txid">{{ tx.txid | slice:0:12 }}…</div>
        <div class="meta">
          <span>{{ tx.vsize | number:'1.0-0' }} vB</span>
          <span>{{ tx.fee }} sat</span>
        </div>
        <button (click)="removeFromBlock(tx)">❌</button>
      </div>
    </div>
  </div>
</div>
